<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{{ page.title | default: site.title | escape }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="site-brand" href="{{ '/' | relative_url }}">translation-work</a>
    <a class="source-link" href="https://github.com/PlanA2Z/translation-work">GitHub 저장소</a>
  </header>
  <main class="page-content">
    {{ content }}
  </main>
  <footer class="site-footer">
    <span>한국어 번역 · Plan a-z</span>
    <a href="https://github.com/PlanA2Z/translation-work">원본 저장소 보기</a>
  </footer>
</body>
</html>
