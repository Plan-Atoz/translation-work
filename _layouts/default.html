<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{{ page.title | default: site.title | escape }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v=8">
  <script src="{{ '/assets/js/footnotes.js' | relative_url }}?v=6" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="site-brand" href="{{ '/' | relative_url }}">translation-work</a>
  </header>
  <main class="page-content">
    <article class="markdown-body">
      {{ content }}
    </article>
  </main>
  <footer class="site-footer">
    <span>Plan A-Z (플랜에이투지)</span>
    <a href="https://github.com/PlanA2Z/translation-work">원본 저장소</a>
  </footer>
</body>
</html>
