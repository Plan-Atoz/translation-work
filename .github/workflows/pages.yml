name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare original Markdown as a native Jekyll page
        shell: bash
        run: |
          {
            printf '%s\n' '---' 'layout: default' 'title: "마흐노주의 운동의 역사 — Peter Arshinov"' 'description: "Peter Arshinov, History of the Makhnovist Movement (1918–1921) 한국어 번역"' 'permalink: /translation/' '---' ''
            cat "arshinov/makhno-movement/History of the Makhnovist Movement (Korean).md"
          } > translation.md
      - name: Build site with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
